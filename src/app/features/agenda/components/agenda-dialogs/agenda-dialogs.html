@if (dialogs.editingTask()) {
  <app-dialog
    heading="Detalle de tarea"
    [variant]="narrow() ? 'full' : undefined"
    [open]="true"
    (openChange)="dialogs.closeTask()"
  >
    @if (dialogs.dialogError()) {
      <app-alert tone="danger">No se pudo guardar la tarea. Inténtalo de nuevo.</app-alert>
    }
    <app-task-form [defaultValues]="taskDefaults()" (saved)="dialogs.saveTask($event)" />
  </app-dialog>
}
@if (dialogs.eventDraft(); as draft) {
  <app-dialog
    heading="Nueva cita"
    description="Agenda una reunión, evento o recordatorio."
    [variant]="narrow() ? 'sheet' : undefined"
    [open]="true"
    (openChange)="dialogs.closeNewEvent()"
  >
    @if (dialogs.dialogError()) {
      <app-alert tone="danger">No se pudo guardar la cita. Inténtalo de nuevo.</app-alert>
    }
    <app-event-form
      cancelable
      [defaultValues]="draft"
      (saved)="dialogs.saveEvent($event)"
      (cancelled)="dialogs.closeNewEvent()"
    />
  </app-dialog>
}
