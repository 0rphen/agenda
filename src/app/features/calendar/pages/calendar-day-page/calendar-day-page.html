<div class="l-screen__top u-mobile-only">
  <app-app-bar
    [heading]="facade.isToday() ? 'Hoy' : title()"
    [subtitle]="facade.isToday() ? title() : undefined"
  >
    <app-icon-button
      appBarActions
      icon="dashboard"
      label="Resumen"
      (clicked)="router.navigateByUrl('/resumen')"
    />
    <app-menu
      appBarActions
      label="Vista"
      icon="more_vert"
      triggerLabel="Cambiar vista"
      [items]="viewItems"
      (itemSelected)="onView($event)"
    />
  </app-app-bar>
</div>
<app-day-main
  [status]="facade.status()"
  [today]="facade.today()"
  [day]="facade.day()"
  [isToday]="facade.isToday()"
  [events]="facade.dayEvents()"
  [allDay]="facade.allDayEvents()"
  [now]="facade.now()"
  [weekDays]="facade.weekDays()"
  (dayChanged)="goTo('dia', $event)"
  (viewChanged)="goTo($event, facade.day())"
  (eventSelected)="facade.selectEvent($event)"
  (slotClicked)="facade.openSlot($event)"
  (retry)="facade.load()"
/>
<app-day-side
  class="u-desktop-only"
  [status]="facade.status()"
  [today]="facade.today()"
  [day]="facade.day()"
  [eventDays]="facade.eventDays()"
  [tasks]="facade.dayTasks()"
  [pendingCount]="facade.pendingCount()"
  [saveError]="facade.saveError()"
  [selectedTaskId]="facade.editingTask()?.id"
  (daySelected)="goTo('dia', $event)"
  (toggled)="facade.toggleTask($event.id, $event.done)"
  (saveErrorDismissed)="facade.dismissSaveError()"
  (taskOpened)="facade.openTask($event)"
  (newEvent)="facade.openNewEvent()"
/>
<div class="l-screen__fab u-mobile-only">
  <app-fab label="Nueva cita" (clicked)="facade.openNewEvent()" />
</div>
<app-agenda-dialogs />
