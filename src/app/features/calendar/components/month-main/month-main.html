<app-breadcrumb class="u-desktop-only" [items]="crumbs()" />
<div class="l-cluster u-desktop-only" data-justify="between">
  <h1 class="page-title">{{ title() }}</h1>
  <div class="l-cluster" data-gap="xs">
    <app-icon-button icon="chevron_left" label="Mes anterior" (clicked)="move(-1)" />
    <app-icon-button icon="chevron_right" label="Mes siguiente" (clicked)="move(1)" />
    <app-button variant="secondary" size="s" (clicked)="dayChanged.emit(today())">Hoy</app-button>
    <app-segmented-control
      label="Vista"
      [options]="viewOptions"
      value="mes"
      (valueChange)="onView($event)"
    />
  </div>
</div>
@switch (status()) {
  @case ('ready') {
    <app-month-view
      class="u-desktop-only"
      [year]="year()"
      [month]="month()"
      [today]="today()"
      [selected]="day()"
      [events]="events()"
      [label]="title()"
      [firstDay]="firstDay()"
      [timeFormat]="timeFormat()"
      [showWeekends]="showWeekends()"
      (selectedChange)="dayChanged.emit($event!)"
      (eventSelected)="eventEdited.emit($event.id!)"
      (moreSelected)="dayOpened.emit($event)"
    />
    <div class="l-stack u-mobile-only" data-gap="s">
      <app-card>
        <app-mini-calendar
          [today]="today()"
          [selected]="day()"
          [events]="eventDays()"
          [firstDay]="firstDay()"
          (selectedChange)="dayChanged.emit($event!)"
        />
      </app-card>
      <div class="l-stack" data-gap="2xs">
        <h2 class="section-title">{{ dayTitle() }}</h2>
        @for (event of dayEvents(); track event.id) {
          <app-agenda-item
            [start]="(event.start | timeFormat) ?? 'Todo el día'"
            [end]="event.end | timeFormat"
            [heading]="event.title"
            [category]="event.category"
            [categoryLabel]="event.categoryLabel"
            (clicked)="eventEdited.emit(event.id)"
          />
        } @empty {
          <app-empty-state
            size="s"
            heading="Sin citas"
            description="No tienes nada este día."
            icon="event_available"
          />
        }
      </div>
    </div>
  }
  @case ('error') {
    <app-alert tone="danger" heading="No se pudo cargar tu agenda">
      Revisa el almacenamiento del navegador e inténtalo de nuevo.
      <app-button alertAction size="s" icon="refresh" (clicked)="retry.emit()"
        >Reintentar</app-button
      >
    </app-alert>
  }
  @default {
    <app-skeleton-list variant="agenda" />
  }
}
