<app-breadcrumb class="u-desktop-only" [items]="crumbs()" />
<div class="l-cluster u-desktop-only" data-justify="between">
  <h1 class="page-title">{{ title() }}</h1>
  <div class="l-cluster" data-gap="xs">
    <app-icon-button icon="chevron_left" label="Día anterior" (clicked)="move(-1)" />
    <app-icon-button icon="chevron_right" label="Día siguiente" (clicked)="move(1)" />
    <app-button variant="secondary" size="s" (clicked)="dayChanged.emit(today())">Hoy</app-button>
    <app-segmented-control
      label="Vista"
      [options]="viewOptions"
      value="dia"
      (valueChange)="onView($event)"
    />
  </div>
</div>
<app-week-strip
  class="u-mobile-only"
  [days]="weekDays()"
  [selected]="day()"
  (selectedChange)="dayChanged.emit($event!)"
/>
@switch (status()) {
  @case ('ready') {
    <app-day-view
      heading="Agenda del día"
      [today]="isToday()"
      [events]="events()"
      [allDay]="allDay()"
      [now]="now()"
      [scrollToHour]="scrollToHour()"
      [workStart]="workStart()"
      [workEnd]="workEnd()"
      [timeFormat]="timeFormat()"
      (eventSelected)="onEvent($event)"
      (slotClicked)="slotClicked.emit($event)"
    />
  }
  @case ('error') {
    <app-alert tone="danger" heading="No se pudo cargar tu agenda">
      Revisa el almacenamiento del navegador e inténtalo de nuevo.
      <app-button alertAction size="s" icon="refresh" (clicked)="retry.emit()"
        >Reintentar</app-button
      >
    </app-alert>
  }
  @default {
    <app-skeleton-list variant="agenda" />
  }
}
