<div class="l-screen__top u-mobile-only">
  <app-app-bar
    heading="Tareas"
    [subtitle]="
      facade.status() === 'ready'
        ? plural(facade.pendingCount(), 'pendiente', 'pendientes')
        : undefined
    "
  />
</div>
<app-tasks-main
  [status]="facade.status()"
  [filter]="facade.filter()"
  [groups]="facade.groups()"
  [pendingCount]="facade.pendingCount()"
  [dueTodayCount]="facade.dueTodayCount()"
  [saveError]="facade.saveError()"
  [selectedTaskId]="facade.selectedTask()?.id"
  [progress]="facade.progress()"
  (filterChanged)="facade.setFilter($event)"
  (added)="facade.addTask($event)"
  (toggled)="facade.toggleTask($event.id, $event.done)"
  (taskOpened)="openTask($event)"
  (saveErrorDismissed)="facade.dismissSaveError()"
  (retry)="facade.load()"
/>
<app-tasks-side
  class="u-desktop-only"
  [status]="facade.status()"
  [progress]="facade.progress()"
  [task]="facade.selectedTask()"
  [detailError]="facade.detailError()"
  (saved)="facade.saveTask($event)"
  (deleted)="facade.askDeleteTask($event)"
  (cancelled)="facade.clearSelection()"
/>
@if (detailOpen() && facade.selectedTask(); as task) {
  <app-dialog
    heading="Detalle de la tarea"
    variant="full"
    [open]="true"
    (openChange)="detailOpen.set(false)"
  >
    @if (facade.detailError()) {
      <app-alert tone="danger">No se pudo guardar la tarea. Inténtalo de nuevo.</app-alert>
    }
    <app-task-form
      deletable
      cancelable
      [defaultValues]="taskDefaults()"
      (saved)="save($event)"
      (deleted)="facade.askDeleteTask(task.id)"
      (cancelled)="closeDetail()"
    />
  </app-dialog>
}
<app-agenda-dialogs />
