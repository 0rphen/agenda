<app-card heading="Tu perfil">
  <div class="l-stack" data-gap="m">
    @if (photoError()) {
      <app-alert tone="danger" dismissible (closed)="photoError.set(false)">
        La foto debe ser JPG o PNG de hasta 2 MB.
      </app-alert>
    }
    <div class="l-cluster" data-gap="m">
      <app-avatar [name]="name()" [src]="photo() || undefined" size="xl" />
      <div class="l-stack" data-gap="2xs">
        <strong>{{ name() }}</strong>
        <span class="settings-page__caption">Foto o iniciales · JPG o PNG, máx. 2 MB</span>
        <div class="l-cluster" data-gap="xs">
          <input #file type="file" accept="image/png,image/jpeg" hidden (change)="pick(file)" />
          <app-button variant="secondary" size="s" icon="upload" (clicked)="file.click()"
            >Cambiar foto</app-button
          >
          <app-button
            variant="ghost-danger"
            size="s"
            [disabled]="!photo()"
            (clicked)="fields().photo().value.set('')"
            >Quitar</app-button
          >
        </div>
      </div>
    </div>
    <div class="l-form-grid">
      <app-text-field label="Nombre" [formField]="fields().firstName" />
      <app-text-field label="Apellido" [formField]="fields().lastName" />
    </div>
    <app-text-field
      label="Correo"
      [value]="email"
      [disabled]="true"
      hint="El correo de la cuenta no se puede cambiar aquí."
    />
    <div class="l-form-grid">
      <app-select label="Zona horaria" [options]="timeZones" [formField]="fields().timeZone" />
      <app-select label="Idioma" [options]="languages" [formField]="fields().language" />
    </div>
  </div>
</app-card>
<app-card heading="Cuenta conectada">
  <app-setting-row icon="mail_outline" label="Google" [description]="'Inicias sesión con ' + email">
    <app-badge settingRowControl tone="success" icon="check_circle">Conectada</app-badge>
  </app-setting-row>
</app-card>
