@if (label()) {
  <label class="field__label" [for]="id()">{{ label() }}</label>
}
<div
  class="input"
  data-select
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="disabled() ? '' : null"
  [attr.data-icon]="icon() ?? null"
>
  <select
    #control
    class="input__control"
    [id]="id()"
    [attr.name]="name() || null"
    [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="hintId()"
    (change)="value.set(control.value)"
    (blur)="touched.set(true)"
  >
    @if (!hasMatch()) {
      <!-- sin esto el navegador muestra la primera opción como elegida y elegirla no emite change -->
      <option value="" disabled hidden selected></option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
</div>
@if (hintId(); as hintId) {
  <div class="field__hint" [id]="hintId">
    @if (error()) {
      <app-icon name="error_outline" size="s" />
    }
    {{ error() || hint() }}
  </div>
}
