<label class="field__label" [for]="id()">{{ label() }}</label>
<div
  class="input"
  [attr.data-select]="options() ? '' : null"
  [attr.data-multiline]="multiline() ? '' : null"
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="disabled() ? '' : null"
>
  @if (icon() && !multiline()) {
    <app-icon [name]="icon()!" />
  }
  @if (options(); as options) {
    <select
      #select
      class="input__control"
      [id]="id()"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      (change)="value.set(select.value)"
      (blur)="touched.set(true)"
    >
      @for (option of options; track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
  } @else if (multiline()) {
    <textarea
      #textarea
      class="input__control"
      [id]="id()"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [rows]="rows()"
      [attr.placeholder]="placeholder() ?? null"
      [value]="value()"
      (input)="value.set(textarea.value)"
      (blur)="touched.set(true)"
    ></textarea>
  } @else {
    <input
      #control
      class="input__control"
      [id]="id()"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [type]="type()"
      [attr.placeholder]="placeholder() ?? null"
      [value]="value()"
      (input)="value.set(control.value)"
      (blur)="touched.set(true)"
    />
  }
  @if (options()) {
    <app-icon name="expand_more" />
  }
</div>
@if (hintId(); as hintId) {
  <div class="field__hint" [id]="hintId">
    @if (error()) {
      <app-icon name="error_outline" size="s" />
    }
    {{ error() || hint() }}
  </div>
}
