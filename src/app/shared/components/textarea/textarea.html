<label class="field__label" [for]="id()">{{ label() }}</label>
<div
  class="input"
  data-multiline
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="disabled() ? '' : null"
>
  <textarea
    #control
    class="input__control"
    [id]="id()"
    [attr.name]="name() || null"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="hintId()"
    [rows]="rows()"
    [attr.placeholder]="placeholder() ?? null"
    [value]="value()"
    (input)="value.set(control.value)"
    (blur)="touched.set(true)"
  ></textarea>
</div>
@if (hintId(); as hintId) {
  <div class="field__hint" [id]="hintId">
    @if (error()) {
      <app-icon name="error_outline" size="s" />
    }
    {{ error() || hint() }}
  </div>
}
