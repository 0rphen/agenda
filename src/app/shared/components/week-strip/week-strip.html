@for (day of days(); track day.iso) {
  <app-day-pill
    fluid
    [dow]="day.dow"
    [num]="day.num"
    [label]="dayLabel(day)"
    [today]="!!day.today"
    [hasEvents]="!!day.hasEvents"
    [selected]="selected() === day.iso"
    [tabIndex]="day.iso === focused() ? 0 : -1"
    (clicked)="selected.set(day.iso); focused.set(day.iso)"
  />
}
