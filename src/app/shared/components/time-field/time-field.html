<label class="field__label" [class.u-visually-hidden]="hideLabel()" [for]="id()">{{
  label()
}}</label>
<div
  class="input"
  [attr.data-invalid]="error() ? '' : null"
  [attr.data-disabled]="disabled() ? '' : null"
  [attr.data-icon]="icon() ?? null"
>
  <input
    #control
    type="time"
    class="input__control"
    [id]="id()"
    [attr.name]="name() || null"
    [attr.aria-label]="ariaLabel() ?? null"
    [disabled]="disabled()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="hintId()"
    [attr.min]="minTime() ?? null"
    [attr.max]="maxTime() ?? null"
    [attr.step]="step() ?? null"
    [value]="value()"
    (input)="value.set(control.value)"
    (blur)="touched.set(true)"
  />
</div>
@if (hintId(); as hintId) {
  <div class="field__hint" [id]="hintId">
    @if (error()) {
      <app-icon name="error_outline" size="s" />
    }
    {{ error() || hint() }}
  </div>
}
