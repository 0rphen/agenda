<div class="calendar__head">
  <h3 class="calendar__title">{{ title() }}</h3>
  <div class="calendar__nav">
    <app-icon-button icon="chevron_left" label="Mes anterior" size="s" (clicked)="go(-1)" />
    <app-icon-button icon="chevron_right" label="Mes siguiente" size="s" (clicked)="go(1)" />
  </div>
</div>
<div class="calendar__grid" role="group" [attr.aria-label]="title()">
  @for (dow of dows; track $index) {
    <div class="calendar__dow" aria-hidden="true">{{ dow }}</div>
  }
  @for (day of days(); track day.iso) {
    <button
      type="button"
      class="calendar__day"
      [attr.aria-pressed]="day.iso === current()"
      [attr.aria-label]="day.label"
      [attr.aria-current]="day.today ? 'date' : null"
      [attr.data-out]="day.out ? '' : null"
      [attr.data-today]="day.today ? '' : null"
      [attr.data-force]="forceState()?.[day.iso] ?? null"
      [disabled]="day.disabled"
      (click)="selected.set(day.iso)"
    >
      {{ day.num }}
      @if (day.events) {
        <span class="calendar__dot"></span>
      }
    </button>
  }
</div>
