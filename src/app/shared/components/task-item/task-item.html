<app-checkbox [(checked)]="done" [ariaLabel]="'Completar: ' + heading()" [disabled]="disabled()" />
<div class="task-item__main">
  <span class="task-item__title">{{ heading() }}</span>
  @if (due() || subtasks() || list()) {
    <span class="task-item__meta">
      @if (due()) {
        <span class="task-item__due"
          ><app-icon [name]="overdue() ? 'error_outline' : 'event'" size="s" /> {{ due() }}</span
        >
      }
      @if (subtasks(); as n) {
        <span>
          <app-icon name="checklist" size="s" />
          {{ n }} {{ n === 1 ? 'subtarea' : 'subtareas' }}
        </span>
      }
      @if (list()) {
        <span class="task-item__list u-category" [attr.data-category]="listColor()">
          <span class="badge__dot" data-category-dot></span>{{ list() }}
        </span>
      }
    </span>
  }
</div>
@if (!disabled()) {
  <button
    type="button"
    class="task-item__open"
    [attr.aria-label]="'Abrir detalle: ' + heading()"
    (click)="$event.stopPropagation(); opened.emit()"
  >
    <app-icon name="chevron_right" />
  </button>
}
