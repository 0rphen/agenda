<div class="week-view__head">
  <span></span>
  @for (d of days(); track d.iso) {
    <div class="week-view__day" [attr.data-today]="d.today ? '' : null">
      <span class="week-view__dow">{{ d.dow }}</span>
      <span class="week-view__num">{{ d.num }}</span>
    </div>
  }
</div>
<div class="week-view__body" #body>
  <div class="week-view__times">
    @for (hour of hours(); track hour) {
      <span class="week-view__time">{{ hour }}:00</span>
    }
  </div>
  @for (d of days(); track d.iso) {
    <div
      class="week-view__col"
      role="group"
      [attr.aria-label]="d.dow + ' ' + d.num"
      [attr.data-today]="d.today ? '' : null"
    >
      @for (e of byDay().get(d.iso) ?? []; track $index) {
        <button
          type="button"
          class="week-view__event u-tint"
          [attr.data-tint]="e.tint || 'periwinkle'"
          [attr.aria-pressed]="!!e.selected"
          [attr.data-selected]="e.selected ? '' : null"
          [attr.data-cancelled]="e.cancelled ? '' : null"
          [attr.data-force]="e.state || null"
          [style.--start]="offset(e.start)"
          [style.--span]="span(e)"
          (click)="eventSelected.emit(e)"
        >
          <span class="week-view__event-time">{{ e.start }} – {{ e.end }}</span>
          @if (e.cancelled) {
            <span class="u-visually-hidden">Cancelado. </span>
          }
          <span class="week-view__event-title">{{ e.title }}</span>
        </button>
      }
      @if (d.today && nowAt() !== null && nowAt()! >= 0) {
        <div
          class="week-view__now"
          [style.--start]="nowAt()"
          role="img"
          [attr.aria-label]="'Ahora ' + now()"
        ></div>
      }
    </div>
  }
</div>
